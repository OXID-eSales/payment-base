name: Development

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  pre-commit-checks:
    name: Pre-commit Checks (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none
          tools: composer:v2, phpcs, phpstan, phpmd

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Pre-commit Checks (Unit Tests + Code Quality)
        run: ./bin/pre-commit-check.sh

  integration-tests:
    name: Integration Tests (OXID Shop)
    runs-on: ubuntu-latest
    needs: [ pre-commit-checks ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: example
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout payment-component
        uses: actions/checkout@v4
        with:
          path: payment-component

      - name: Clone OXID eShop
        run: |
          git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch b-7.4.x --single-branch shop
          cp shop/source/config.inc.php.dist shop/source/config.inc.php
          sed -i -e 's/<dbHost>/127.0.0.1/'\
                 -e 's/<dbUser>/root/'\
                 -e 's/<dbName>/example/'\
                 -e 's/<dbPwd>/root/'\
                 -e 's/<dbPort>/3306/'\
                 -e 's/<sShopURL>/http:\/\/localhost\//'\
                 -e 's/<sShopDir>/\/github\/workspace\/shop\/source\//'\
                 -e 's/<sCompileDir>/\/github\/workspace\/shop\/source\/tmp\//'\
              shop/source/config.inc.php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Install payment-component in shop
        working-directory: shop
        run: |
          composer config repositories.payment-component path ../payment-component
          composer require oxid-esales/payment-component:* --no-interaction

      - name: Setup database
        working-directory: shop
        run: |
          mysql -h127.0.0.1 -uroot -proot example < source/Setup/Sql/database_schema.sql || true

      - name: Run Integration Tests
        working-directory: shop
        run: |
          vendor/bin/phpunit -c vendor/oxid-esales/payment-component/phpunit.xml \
            --testsuite Integration \
            --bootstrap source/bootstrap.php || echo "Some integration tests may require full shop setup"
