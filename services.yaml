services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # --------------------------------------------------------------
  # Admin — shared "Payment" tab (Sprint I).
  #
  # PSP modules inject panel providers tagged `oe.payment.admin_panel`.
  # The registry iterates them; the first supporting provider renders
  # its body inside the shared wrapper template.
  # --------------------------------------------------------------

  OxidEsales\PaymentBase\Admin\Contract\PaymentPanelRegistryInterface:
    class: OxidEsales\PaymentBase\Admin\PaymentPanelRegistry
    arguments:
      - !tagged_iterator oe.payment.admin_panel
    public: true

  OxidEsales\PaymentBase\Admin\PaymentAdminActionDispatcher:
    arguments:
      - '@OxidEsales\PaymentBase\Admin\Contract\PaymentPanelRegistryInterface'
    public: true

  # Admin controller — instantiated by OXID via metadata.php `controllers`
  # map, not via the `oxid.view_controller` tag. We register it as a
  # container service anyway so tests / diagnostic harnesses can resolve it
  # with DI, but OXID's runtime creates its own instance via oxNew-style
  # dispatch and lazy-fetches dependencies through ContainerFactory.
  OxidEsales\PaymentBase\Admin\PaymentAdminController:
    arguments:
      - '@OxidEsales\PaymentBase\Admin\Contract\PaymentPanelRegistryInterface'
      - '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      - '@OxidEsales\PaymentBase\Admin\PaymentAdminActionDispatcher'
    public: true

  # Sprint 93 — register the contract repository here too (it's
  # also bound in stripe-wallet's services.yaml, but PC needs the
  # binding in its OWN services.yaml so `oe:module:activate
  # oe_payment_base` succeeds standalone. OXID's
  # ServicesYamlValidator compiles this file in isolation when
  # activating the module, before any PSP module's services.yaml has
  # merged in.
  OxidEsales\PaymentBase\Repository\ContractRepositoryInterface:
    class: OxidEsales\PaymentBase\Repository\DoctrineContractRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  OxidEsales\PaymentBase\Repository\DoctrineContractRepository:
    alias: OxidEsales\PaymentBase\Repository\ContractRepositoryInterface
    public: true

  # --------------------------------------------------------------
  # Sprint 08 (2026-08-28) — abandoned-checkout collector.
  #
  # PSP modules create the order before redirecting to the provider, so a
  # customer who never returns leaves an order at NOT_FINISHED with its
  # vouchers spent. Cleanup used to happen only as a side effect of that
  # customer retrying, or of an inbound provider webhook — a shop with
  # neither collected nothing at all. The command below is the scheduled
  # caller. It lives here rather than in a PSP module because every module
  # using the early-order pattern leaves the same residue.
  # --------------------------------------------------------------

  OxidEsales\PaymentBase\Repository\NotFinishedOrderRepositoryInterface:
    class: OxidEsales\PaymentBase\Repository\DoctrineNotFinishedOrderRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  # STRP-168 — the narrow half, for consumers that only need to hand a
  # customer their voucher back (the Stripe webhook that learns a payment
  # ended) and have no business running order queries.
  OxidEsales\PaymentBase\Repository\VoucherReleaseInterface:
    alias: OxidEsales\PaymentBase\Repository\NotFinishedOrderRepositoryInterface
    public: true

  OxidEsales\PaymentBase\Service\NotFinishedOrderCleanupSettingsInterface:
    class: OxidEsales\PaymentBase\Service\NotFinishedOrderCleanupSettings
    public: true

  OxidEsales\PaymentBase\Service\NotFinishedOrderCleanupServiceInterface:
    class: OxidEsales\PaymentBase\Service\NotFinishedOrderCleanupService
    arguments:
      $orderRepository:    '@OxidEsales\PaymentBase\Repository\NotFinishedOrderRepositoryInterface'
      $contractRepository: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      $logger:             '@?Psr\Log\LoggerInterface'
    public: true

  # Console command: oe:payments:not_finished:cleanup
  OxidEsales\PaymentBase\Command\CleanupNotFinishedOrdersCommand:
    arguments:
      $cleanupService: '@OxidEsales\PaymentBase\Service\NotFinishedOrderCleanupServiceInterface'
      $settings:       '@OxidEsales\PaymentBase\Service\NotFinishedOrderCleanupSettingsInterface'
    tags:
      - { name: 'console.command', command: 'oe:payments:not_finished:cleanup' }
    public: true

  # Sprint 93 — `doctrine.dbal.connection` is a factory wrapper
  # around OXID's ConnectionProviderInterface (which IS in core).
  # Defined identically in stripe-wallet's services.yaml; needed
  # here too so PC standalone activation can wire DoctrineContractRepository.
  doctrine.dbal.connection:
    class: Doctrine\DBAL\Connection
    factory: ['@OxidEsales\EshopCommunity\Internal\Framework\Database\ConnectionProviderInterface', 'get']
    public: false

  # Sprint 03 (2026-05-19) — payment-base owns the refund routing decision.
  # Any consumer that emits a RefundIntentEventInterface gets the verb
  # (refund / cancel-auth / partial-capture) decided here based on
  # contract state, then dispatched through the broker to the active PSP.
  #
  # Listener-binding is the CONSUMER's responsibility: the consumer's own
  # services.yaml adds a `kernel.event_listener` tag pointing at its own
  # concrete event class (see opalreturns' services.yaml for an example).
  # This is because Symfony's EventDispatcher resolves listeners by exact
  # dispatched class name, not by interface walk — the consumer module is
  # the place that knows which event(s) it dispatches.
  # Sprint 119 (STRP-129) — ValidationBase library: per-field character-level
  # validator. ValidationRuleLoaderInterface is the primary injectable dep;
  # ValidationBase itself is NOT registered as a singleton because its
  # constructor requires a $pluginModuleId — consumers instantiate it
  # directly with `new ValidationBase($pluginId, $loader)`.

  OxidEsales\PaymentBase\Validation\PluginPathResolverInterface:
    class: OxidEsales\PaymentBase\Validation\OxidPluginPathResolver
    arguments:
      $moduleConfigurationDao: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Configuration\Dao\ModuleConfigurationDaoInterface'
      $context: '@OxidEsales\EshopCommunity\Internal\Transition\Utility\BasicContextInterface'
    public: false

  OxidEsales\PaymentBase\Validation\ValidationRuleLoaderInterface:
    class: OxidEsales\PaymentBase\Validation\FilesystemValidationRuleLoader
    arguments:
      $pathResolver: '@OxidEsales\PaymentBase\Validation\PluginPathResolverInterface'
    public: true

  # Factory for creating per-module ValidationBase instances.
  # Each payment provider needs its own ValidationBase instance with their specific
  # module ID. Providers use this factory instead of defining their own.
  OxidEsales\PaymentBase\Validation\ValidationBaseFactory:
    arguments:
      $loader: '@OxidEsales\PaymentBase\Validation\ValidationRuleLoaderInterface'
    public: true

  OxidEsales\PaymentBase\EventSystem\Handler\RefundIntentHandler:
    arguments:
      $contractRepository: '@?OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      $broker:             '@?OxidEsales\PaymentBase\EventSystem\Broker\EventBrokerInterface'
      $captureStatusQuery: '@?OxidEsales\PaymentBase\Service\PaymentCaptureStatusQueryInterface'
      $logger:             '@?Psr\Log\LoggerInterface'
    public: true

  # ---------------------------------------------------------------
  # Sprint 119 (STRP-129) Phase A2 — central frontend validation
  # endpoint + seven-guard chain + per-PSP rate-limit override.
  # ---------------------------------------------------------------

  # --- Guard implementations ---

  OxidEsales\PaymentBase\Validation\Guard\PostOnlyGuard:
    tags:
      - { name: oe.payment_base.validation_guard, priority: 10 }

  OxidEsales\PaymentBase\Validation\Guard\PayloadSizeGuard:
    tags:
      - { name: oe.payment_base.validation_guard, priority: 20 }

  OxidEsales\PaymentBase\Validation\Guard\ActiveSessionGuard:
    tags:
      - { name: oe.payment_base.validation_guard, priority: 30 }

  OxidEsales\PaymentBase\Validation\Guard\ShopUrlResolverInterface:
    class: OxidEsales\PaymentBase\Validation\Guard\OxidShopUrlResolver

  OxidEsales\PaymentBase\Validation\Guard\SameOriginGuard:
    arguments:
      $shopUrlResolver: '@OxidEsales\PaymentBase\Validation\Guard\ShopUrlResolverInterface'
    tags:
      - { name: oe.payment_base.validation_guard, priority: 40 }

  OxidEsales\PaymentBase\Validation\Guard\SessionChallengeVerifierInterface:
    class: OxidEsales\PaymentBase\Validation\Guard\OxidSessionChallengeVerifier

  OxidEsales\PaymentBase\Validation\Guard\CsrfTokenGuard:
    arguments:
      $verifier: '@OxidEsales\PaymentBase\Validation\Guard\SessionChallengeVerifierInterface'
    tags:
      - { name: oe.payment_base.validation_guard, priority: 50 }

  # Rate-limit store — Doctrine-backed production impl (reuses oe_payments_idempotency).
  OxidEsales\PaymentBase\Validation\RateLimit\RateLimitStoreInterface:
    class: OxidEsales\PaymentBase\Validation\RateLimit\DoctrineRateLimitStore
    arguments:
      $connection: '@doctrine.dbal.connection'

  # Per-PSP override tagged iterator (empty in this sprint; PSPs opt in via the tag).
  # The global default is 30 req/min, matching the admin setting `iValidationApiRatePerMinute`.
  # Note: wiring the live admin setting requires ModuleSettingBridgeInterface; deferred
  # to Phase E when an admin-UI integration sprint adds the bridge dep.
  OxidEsales\PaymentBase\Validation\RateLimit\RateLimitConfigInterface:
    class: OxidEsales\PaymentBase\Validation\RateLimit\ConfigurableRateLimitConfig
    arguments:
      $globalDefault: 30
      $overrides: !tagged_iterator oe.payment_base.rate_limit_override

  OxidEsales\PaymentBase\Validation\Guard\RateLimitGuard:
    arguments:
      $store: '@OxidEsales\PaymentBase\Validation\RateLimit\RateLimitStoreInterface'
      $config: '@OxidEsales\PaymentBase\Validation\RateLimit\RateLimitConfigInterface'
    tags:
      - { name: oe.payment_base.validation_guard, priority: 60 }

  OxidEsales\PaymentBase\Validation\Guard\ActiveModuleQueryInterface:
    class: OxidEsales\PaymentBase\Validation\Guard\OxidActiveModuleQuery
    arguments:
      $bridge: '@OxidEsales\EshopCommunity\Internal\Framework\Module\Setup\Bridge\ModuleActivationBridgeInterface'
      $context: '@OxidEsales\EshopCommunity\Internal\Transition\Utility\BasicContextInterface'

  OxidEsales\PaymentBase\Validation\Guard\PluginIdAllowlistGuard:
    arguments:
      $activeModuleQuery: '@OxidEsales\PaymentBase\Validation\Guard\ActiveModuleQueryInterface'
    tags:
      - { name: oe.payment_base.validation_guard, priority: 70 }

  # --- Controller ---
  # Registered in metadata.php `controllers` map (cl=oepaymentvalidationapi).
  # NOT tagged with oxid.view_controller to avoid "Controller namespace duplication"
  # on activation (per memory feedback_oxid_controller_duplication).
  OxidEsales\PaymentBase\Controller\ValidationApiController:
    public: true

  # Gettable wrappers around the tagged iterators. ValidationApiController runs
  # under OXID `cl=` dispatch and resolves these by id (it cannot constructor-
  # inject tagged iterators). Public so Container::get() can reach them.
  oe.payment_base.validation_guard_iterator:
    class: OxidEsales\PaymentBase\Validation\TaggedServiceCollection
    arguments:
      - !tagged_iterator oe.payment_base.validation_guard
    public: true

  oe.payment_base.validation_message_formatter_iterator:
    class: OxidEsales\PaymentBase\Validation\TaggedServiceCollection
    arguments:
      - !tagged_iterator oe.payment_base.validation_message_formatter
    public: true

  # --- Message formatter SPI (Sprint 119 Phase E) ---
  # PSP modules register their MessageFormatterInterface impl with this tag.
  # The tagged iterator is fetched by ValidationApiController::init() under the
  # key 'oe.payment_base.validation_message_formatter_iterator'.
  # Empty by default; the tag is the opt-in point for PSP modules.
  # (No concrete formatter is registered here — payment-base is provider-agnostic.)

  # Sprint 125 (STRP-157) — per-line VAT calculator.
  # Public so PriceList can resolve it via ContainerFactory::get().
  OxidEsales\PaymentBase\Math\Vat\PerLineVatCalculatorInterface:
    class: OxidEsales\PaymentBase\Math\Vat\PerLineVatCalculator
    public: true
    arguments:
      $precision: 2

  # Sprint 06 — single active payment method: assign it, skip the selection step.
  # All three are public: the classic-checkout controller extensions run under
  # OXID `cl=` dispatch (no constructor DI) and resolve them via ContainerFactory,
  # and one-page checkout resolves the resolver the same way.
  OxidEsales\PaymentBase\Checkout\Contract\SinglePaymentResolverInterface:
    class: OxidEsales\PaymentBase\Checkout\SinglePaymentResolver
    public: true

  OxidEsales\PaymentBase\Checkout\Contract\SinglePaymentAssignerInterface:
    class: OxidEsales\PaymentBase\Checkout\SinglePaymentAssigner
    public: true

  OxidEsales\PaymentBase\Checkout\Contract\SinglePaymentSettingsInterface:
    class: OxidEsales\PaymentBase\Checkout\SinglePaymentSettings
    public: true

  # Sprint 07 — single active shipping method: assign it, hide the selector.
  # Public for the same reason as their payment siblings: the classic-checkout
  # controller extensions run under OXID `cl=` dispatch (no constructor DI) and
  # resolve them via ContainerFactory. A private service would be inlined away
  # and the runtime get() would die on a removed id.
  OxidEsales\PaymentBase\Checkout\Contract\SingleShippingResolverInterface:
    class: OxidEsales\PaymentBase\Checkout\SingleShippingResolver
    public: true

  OxidEsales\PaymentBase\Checkout\Contract\SingleShippingAssignerInterface:
    class: OxidEsales\PaymentBase\Checkout\SingleShippingAssigner
    public: true

  OxidEsales\PaymentBase\Checkout\Contract\SingleShippingSettingsInterface:
    class: OxidEsales\PaymentBase\Checkout\SingleShippingSettings
    public: true

  # Sprint 07 S6 — one-shot permission to skip the payment step. Public: both
  # controller extensions resolve it via ContainerFactory (one grants the skip,
  # the other re-arms it), and a private service would be inlined away.
  OxidEsales\PaymentBase\Checkout\Contract\PaymentStepSkipGuardInterface:
    class: OxidEsales\PaymentBase\Checkout\PaymentStepSkipGuard
    public: true

  # IFRAME-01 — "Use iframe instead of checkout button" read accessor.
  # Public so PSP modules (and the OPC footer-widget path) can resolve the
  # provider-agnostic flag via ContainerFactory::get(). Names no provider.
  OxidEsales\PaymentBase\Service\IframeCheckoutSettingsInterface:
    class: OxidEsales\PaymentBase\Service\IframeCheckoutSettings
    public: true
